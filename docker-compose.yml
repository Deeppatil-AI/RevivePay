version: '3.8'

services:
  revivepay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revivepay-sentinel
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AUTH_BYPASS_DEMO=true
      - VITE_RAZORPAY_KEY=rzp_test_sec_99481
      - RAZORPAY_KEY_ID=rzp_test_sec_99481
      - RAZORPAY_KEY_SECRET=rzp_test_secret_key_here
      - RAZORPAY_WEBHOOK_SECRET=rzp_wh_secret_revivepay_2026
      - DATABASE_PATH=/app/data/revivepay.sqlite
    volumes:
      - revivepay-data:/app/data
    restart: unless-stopped

volumes:
  revivepay-data:
    driver: local
